name: Deploy Agda HTML to Pages

# L'HTML non viene piu' generato qui.  Viene generato in locale, con la stessa
# Agda che verifica lo sviluppo (2.9.0, dal flake github:agda/agda), e committato
# nella directory html/.  Il motivo e' che la generazione su runner non arrivava
# in fondo: l'ultimo tentativo si e' fermato su MixHelpers dopo diciotto minuti,
# mentre in locale l'intero PaperIndex esce in meno di tre.  Per rigenerare:
#
#   agda -i . -i <cubical> --html --html-dir=html PaperIndex.agda
#
# e poi ricreare html/index.html (vedi lo storico di questo file per lo script).

on:
  push:
    branches: [main]
    paths:
      - 'html/**'
      - '.github/workflows/deploy-html.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check
        run: |
          test -f html/index.html || { echo "html/index.html assente: rigenerare in locale"; exit 1; }
          n=$(ls html/S4dot2.*.html | wc -l)
          echo "moduli S4dot2 pubblicati: $n"
          test "$n" -ge 30 || { echo "troppo pochi moduli, generazione incompleta"; exit 1; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
